<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO & PWA Primary -->
    <title>FinNexus Enterprise - Gestão Financeira</title>
    <meta
      name="description"
      content="Plataforma enterprise de gestão financeira com IA, relatórios avançados e controle total de fluxo de caixa."
    />
    <meta
      name="keywords"
      content="gestão financeira, enterprise, fluxo de caixa, relatórios financeiros, contabilidade"
    />
    <meta name="author" content="InTech Finance" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="shortcut icon" href="/icons/icon-192x192.png" />

    <!-- Apple PWA (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="FinNexus" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/icon-144x144.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/icons/icon-512x512.png"
    />

    <!-- Theme & Color -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="msapplication-TileColor" content="#4f46e5" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="FinNexus Enterprise" />
    <meta
      property="og:description"
      content="Gestão Financeira Empresarial Inteligente"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
  </head>

  <body
    class="text-slate-900 dark:text-slate-100 bg-[#F8F9FC] dark:bg-[#0B1120] antialiased selection:bg-indigo-100 selection:text-indigo-900 transition-colors duration-300"
  >
    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
